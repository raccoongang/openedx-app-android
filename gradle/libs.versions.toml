[versions]
# SDK
compileSdk = "36"
targetSdk = "36"
minSdk = "24"

# Plugin versions
agp = "8.12.2"
kotlin = "2.2.10"
ksp = "2.2.10-2.0.2"
googleServices = "4.4.3"
firebaseCrashlytics = "3.0.6"
detekt = "1.23.8"

# AndroidX
room = "2.7.2"
coreSplashscreen = "1.0.1"
activityCompose = "1.10.1"
browser = "1.9.0"
credentials = "1.5.0"
datastorePreferences = "1.2.0"
archCore = "2.2.0"

# Compose
composeUiTooling = "1.7.8"

# Media
media3 = "1.8.0"
youtubePlayer = "13.0.0"
extendedSpans = "1.4.0"

# Firebase
firebaseBom = "33.0.0"

# Google
playServicesAuth = "21.4.0"
playServicesAdsIdentifier = "18.2.0"
googleId = "1.1.1"
inAppReview = "2.0.2"

# Navigation
composeNavigation = "2.9.0-alpha07"

# Ktor
ktor = "3.1.3"
kotlinxSerialization = "1.8.1"

# Third-party
jsoup = "1.21.2"
zip4j = "2.11.5"
branchSdk = "5.20.0"
installReferrer = "2.2"
snakeyaml = "2.4"
brazeSdk = "37.0.0"
opentelemetry = "1.53.0"

# OpenEdx
openedxFoundation = "1.1.1"
openedxFirebaseAnalytics = "1.0.1"

# Social Login
facebookLogin = "18.1.3"
msal = "7.0.0"

# Testing
junit = "4.13.2"
mockk = "1.14.5"
testExtJunit = "1.3.0"
espresso = "3.7.0"
coroutinesTest = "1.10.2"

[libraries]
# AndroidX
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastorePreferences" }
androidx-browser = { group = "androidx.browser", name = "browser", version.ref = "browser" }
androidx-credentials = { group = "androidx.credentials", name = "credentials", version.ref = "credentials" }
androidx-credentials-playServicesAuth = { group = "androidx.credentials", name = "credentials-play-services-auth", version.ref = "credentials" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-arch-core-testing = { group = "androidx.arch.core", name = "core-testing", version.ref = "archCore" }

# Navigation
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "composeNavigation" }

# Room
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

# Compose
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling", version.ref = "composeUiTooling" }

# Media3
media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-exoplayer-hls = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
media3-cast = { group = "androidx.media3", name = "media3-cast", version.ref = "media3" }

# YouTube Player
youtubePlayer-core = { group = "com.pierfrancescosoffritti.androidyoutubeplayer", name = "core", version.ref = "youtubePlayer" }
youtubePlayer-customUi = { group = "com.pierfrancescosoffritti.androidyoutubeplayer", name = "custom-ui", version.ref = "youtubePlayer" }

# Extended Spans
extendedspans = { group = "me.saket.extendedspans", name = "extendedspans", version.ref = "extendedSpans" }

# Firebase
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
firebase-common-ktx = { group = "com.google.firebase", name = "firebase-common-ktx" }
firebase-crashlytics-ktx = { group = "com.google.firebase", name = "firebase-crashlytics-ktx" }

# Google
google-playServices-auth = { group = "com.google.android.gms", name = "play-services-auth", version.ref = "playServicesAuth" }
google-playServices-adsIdentifier = { group = "com.google.android.gms", name = "play-services-ads-identifier", version.ref = "playServicesAdsIdentifier" }
google-googleId = { group = "com.google.android.libraries.identity.googleid", name = "googleid", version.ref = "googleId" }
google-inAppReview = { group = "com.google.android.play", name = "review-ktx", version.ref = "inAppReview" }

# Third-party
jsoup = { group = "org.jsoup", name = "jsoup", version.ref = "jsoup" }
zip4j = { group = "net.lingala.zip4j", name = "zip4j", version.ref = "zip4j" }
branch-sdk = { group = "io.branch.sdk.android", name = "library", version.ref = "branchSdk" }
installReferrer = { group = "com.android.installreferrer", name = "installreferrer", version.ref = "installReferrer" }
snakeyaml = { group = "org.yaml", name = "snakeyaml", version.ref = "snakeyaml" }
braze-sdk = { group = "com.braze", name = "android-sdk-ui", version.ref = "brazeSdk" }

# OpenTelemetry
opentelemetry-api = { group = "io.opentelemetry", name = "opentelemetry-api", version.ref = "opentelemetry" }
opentelemetry-context = { group = "io.opentelemetry", name = "opentelemetry-context", version.ref = "opentelemetry" }

# Social Login
facebook-login = { group = "com.facebook.android", name = "facebook-login", version.ref = "facebookLogin" }
microsoft-msal = { group = "com.microsoft.identity.client", name = "msal", version.ref = "msal" }

# OpenEdx
openedx-foundation = { group = "com.github.openedx", name = "openedx-app-foundation-android", version.ref = "openedxFoundation" }
openedx-firebase-analytics = { group = "com.github.openedx", name = "openedx-app-firebase-analytics-android", version.ref = "openedxFirebaseAnalytics" }

# Testing
junit = { group = "junit", name = "junit", version.ref = "junit" }
mockk = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
mockk-android = { group = "io.mockk", name = "mockk-android", version.ref = "mockk" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }
androidx-test-espresso = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutinesTest" }

# Ktor
ktor-client-core = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { group = "io.ktor", name = "ktor-client-logging", version.ref = "ktor" }
ktor-client-auth = { group = "io.ktor", name = "ktor-client-auth", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }

# kotlinx.serialization
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

# Detekt
detekt-formatting = { group = "io.gitlab.arturbosch.detekt", name = "detekt-formatting", version.ref = "detekt" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebaseCrashlytics" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
